name: Build native

# Produces the buildmonitor_ui binaries committed under
# src/BuildMonitor.Native/runtimes/{rid}/native, in the head that loads them. There is no Windows
# equivalent: that head renders with WinForms.
#
# They are committed rather than built during a normal build so that a plain
# `dotnet build src --configuration Release` produces a shippable package on any machine, and
# contributors never need a C++ toolchain. Run this whenever native/ changes.
#
# The work is PlatformHeads' build-native workflow, which DiffEngine's viewer is built by too: the
# Linux library built in a manylinux_2_28 container and checked for the glibc it needs and the
# libraries it records as needed, the universal dylib, and the pull request with the binaries.
# Each of those was once a copy here, and a fix made to the other copy did not reach this one.
# The tag is the one native/CMakeLists.txt fetches and Directory.Packages.props names.
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'native/**'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Open a PR with the rebuilt binaries'
        type: boolean
        default: true

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: SimonCropp/PlatformHeads/.github/workflows/build-native.yml@0.7.1
    permissions:
      contents: write
      pull-requests: write
    with:
      library: buildmonitor_ui
      linux-runtimes: src/BuildMonitor.Native/runtimes
      swift-package: native/swift
      mac-runtimes: src/BuildMonitor.Native/runtimes
      # The folder panel, and turning AppKit's frames into the ABI's placements, are what the
      # macOS head decides by itself rather than drawing from a screen the managed side built, so
      # they are what has tests there.
      swift-test: true
      # Also on push, not just manual dispatch. workflow_dispatch does not appear in the Actions
      # UI until the workflow is on the default branch, so on a feature branch a push is the only
      # way to trigger this.
      propose: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
      pull-request-title: Rebuild native UI binaries
