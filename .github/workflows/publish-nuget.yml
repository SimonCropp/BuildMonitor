name: Publish NuGet

# Packs BuildMonitor and pushes it to nuget.org using Trusted Publishing (OIDC), so no long lived
# API key is stored. GitHub Actions mints a short lived OIDC token; the NuGet/login action
# exchanges it for a temporary nuget.org API key, issued only because a matching
# trusted-publishing policy is registered for this repo and workflow.
#
# One-time setup:
#   1. nuget.org -> Account -> Trusted Publishing: add a policy for this GitHub owner and
#      repository, scoped to this workflow file, covering BuildMonitor.
#
# The nuget.org username is hard coded below: it is not sensitive, and the policy is bound to this
# repository anyway.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  id-token: write   # required: lets the job request a GitHub OIDC token
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    # Windows, because the Windows head is WinForms and the packaging tests that pin the package
    # contents only run there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet OIDC login
        uses: NuGet/login@v1
        id: login
        with:
          user: simoncropp

      # A plain build is the pack step: ProjectDefaults sets GeneratePackageOnBuild for every
      # Release package project, so the package is produced by its own build, with every head
      # bundled, into ./nugets. Deliberately not `dotnet pack`, which on a solution races with
      # GeneratePackageOnBuild.
      - name: Build and pack
        run: dotnet build src --configuration Release

      # BM0001 warns when a RID has no native renderer. Shipping a package that cannot run on a
      # platform it claims to support is worse than failing the release.
      - name: Verify every RID has a native renderer
        shell: bash
        run: |
          missing=0
          check() {
            directory="src/BuildMonitor.Native/runtimes/$1/native"
            if [ -z "$(ls -A "$directory" 2>/dev/null)" ]; then
              echo "::error::No native renderer for $1. Run the build-native workflow."
              missing=1
            fi
          }
          # No Windows RIDs: that head renders with WinForms and loads no native library.
          check linux-x64
          check linux-arm64
          check osx-x64
          check osx-arm64
          exit $missing

      # Enumerated rather than passed as a glob. This job runs on Windows, where the shell is pwsh
      # and a quoted wildcard reaches dotnet unexpanded, so "nugets/*.nupkg" is read as a literal
      # filename and the push fails with "File does not exist".
      #
      # --skip-duplicate makes re-runs idempotent.
      - name: Push to nuget.org
        run: |
          $packages = Get-ChildItem -Path nugets -Filter *.nupkg
          if ($packages.Count -eq 0)
          {
            throw "No packages were produced by the build."
          }

          Write-Host "Pushing $($packages.Count) packages"
          foreach ($package in $packages)
          {
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0)
            {
              throw "Failed to push $($package.Name)"
            }
          }
